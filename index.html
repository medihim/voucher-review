:root[data-theme="dark"]{
 --bg:#151015; --paper:#1e171d; --fg:#f4edf2; --muted:#b4a7b1; --line:#352830; --soft:#281e26;
 --pink:#ff7fd5; --pink-strong:#e2489f; --pink-ink:#ff9fdf; --pink-soft:#3b1e33; --pink-tint:#21161f; --on-pink:#ffffff;
 --ok:#74d39d; --ok-bg:#15301f; --warn:#f3b867; --warn-bg:#36280f; --bad:#ff8f87; --bad-bg:#3c1c1a; --neutral:#c5b9c3; --neutral-bg:#2c232a;
 --shadow:0 12px 32px rgba(0,0,0,.35); --logo-bg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;letter-spacing:-.012em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:8px 80px}
h1,h2,h3,h4{text-wrap:balance;letter-spacing:-.035em}
a{color:var(--pink-ink)}
.logo-wrap{display:inline-flex;background:var(--logo-bg);border-radius:12px;padding:6px 10px;margin-left:-10px}
.logo{height:30px;width:auto;display:block}
.eyebrow{margin:0 0 6px;color:var(--pink-ink);font-size:12.5px;font-weight:700;letter-spacing:.08em}
.btn{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:999px;padding:8px 15px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pink);color:var(--pink-ink)}
.btn.primary{background:var(--pink-strong);border-color:var(--pink-strong);color:var(--on-pink);padding:11px 22px;font-weight:700}
.btn.primary:hover{filter:brightness(1.06);color:var(--on-pink)}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* 잠금 화면 */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background:radial-gradient(60% 50% at 85% 10%,var(--pink-soft),transparent 70%),radial-gradient(50% 45% at 10% 95%,var(--pink-soft),transparent 70%),var(--bg)}
.gate-card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:var(--shadow);display:grid;gap:0}
.gate-card .logo-wrap{justify-self:start;margin-bottom:22px}
.gate-title{font-size:clamp(26px,6vw,32px);line-height:1.25;margin:0 0 12px;font-weight:800}
.gate-desc{margin:0 0 22px;color:var(--muted);font-size:14px}
.gate-label{font-size:13px;font-weight:700;margin-bottom:6px}
.pw-row{display:flex;gap:8px}
.pw-row input{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:999px;padding:11px 18px;background:var(--pink-tint);color:var(--fg)}
.pw-row input:focus{border-color:var(--pink)}
.gate-err{min-height:22px;margin:8px 0 0;color:var(--bad);font-size:13px;font-weight:600}
.gate-note{margin:6px 0 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* 브랜드 헤더 */
.brand{background:linear-gradient(180deg,var(--paper) 0%,var(--pink-tint) 100%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-300px;border-radius:50%;background:radial-gradient(circle,var(--pink-soft) 0%,transparent 70%);pointer-events:none}
.brand-in{position:relative;z-index:1;padding-block:22px 26px}
.brand-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.brand h1{font-size:clamp(25px,3.4vw,36px);line-height:1.28;margin:0 0 10px;font-weight:800}
.ver{display:inline-block;vertical-align:middle;font-size:.45em;font-weight:800;background:var(--pink-strong);color:var(--on-pink);border-radius:999px;padding:3px 11px;letter-spacing:0;transform:translateY(-3px)}
.lead{margin:0;max-width:68ch;color:var(--muted);font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.toc a{font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.toc a:hover{border-color:var(--pink);color:var(--pink-ink)}

section{margin-top:44px;scroll-margin-top:16px}
h2{font-size:21px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pink-soft);color:var(--pink-ink);font-size:15px;flex:none}
h3{font-size:16.5px;margin:28px 0 10px;font-weight:700}
.conclusion{display:flex;gap:12px;align-items:flex-start;background:var(--pink-tint);border:1px solid var(--pink-soft);border-radius:16px;padding:14px 18px;margin:0 0 18px}
.conclusion p{margin:0;font-weight:600;line-height:1.65}
.chip{flex:none;font-size:12px;font-weight:800;color:var(--on-pink);background:var(--pink-strong);border-radius:999px;padding:3px 10px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);margin:0;font-weight:600}
.kpi .v{font-size:32px;font-weight:800;line-height:1.15;margin:6px 0 2px;letter-spacing:-.03em}
.unit{font-size:14px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12.5px;color:var(--muted);margin:0}
.kpi.bad .v{color:var(--bad)}
.kpi.brandk{background:var(--pink-tint);border-color:var(--pink-soft)}
.kpi.brandk .v{color:var(--pink-ink)}
.purpose{font-size:13px;color:var(--muted);margin:12px 0 8px;max-width:90ch}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th{background:var(--soft);text-align:left;padding:11px 14px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;color:var(--muted)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.total td{background:var(--pink-tint)}
td.num,th.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.sub2{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.55}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neutral{background:var(--neutral-bg);color:var(--neutral)}
.tag.p0{background:var(--bad-bg);color:var(--bad)} .tag.p1{background:var(--warn-bg);color:var(--warn)} .tag.p2{background:var(--neutral-bg);color:var(--neutral)}
.fact{font-size:11px;font-weight:700;color:var(--pink-ink);background:var(--pink-soft);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.bar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar i{display:block;height:8px;border-radius:999px;background:var(--soft);flex:1;overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--pink);border-radius:999px}
.bar i b.warn{background:var(--warn)} .bar i b.bad{background:var(--bad)} .bar i b.ok{background:var(--ok)}
.bar span{font-size:12.5px;width:36px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h4{margin:0 0 8px;font-size:15px;font-weight:700}
.card .n{color:var(--pink-ink);margin-right:6px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar input,.toolbar select{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--paper);color:var(--fg);min-width:0}
.toolbar input{flex:1 1 220px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.count{font-size:12.5px;color:var(--muted);margin-left:auto}
.cat{font-size:12.5px;color:var(--pink-ink);font-weight:800;letter-spacing:.03em;margin:22px 0 8px}
.req{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.req summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req summary::-webkit-details-marker{display:none}
.req summary:hover{background:var(--pink-tint)}
.req[open] summary{background:var(--pink-tint);border-bottom:1px solid var(--line)}
.rid{font-weight:800;color:var(--pink-ink);min-width:44px}
.rt{font-weight:700;flex:1;min-width:200px}
.rel{font-size:12.5px;color:var(--muted)}
.rbody{padding:14px 18px;display:grid;gap:12px;font-size:13.5px}
.rbody dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:6px 12px}
.rbody dt{color:var(--muted);font-size:12.5px;font-weight:700}
.rbody dd{margin:0;min-width:0}
.reply{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.reply .full{grid-column:1/-1}
.reply label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.reply label.mt{margin-top:8px}
.reply textarea,.reply select,.reply input{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--pink-tint);color:var(--fg)}
.reply textarea{min-height:66px;resize:vertical}
.todo{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.todo ol{margin:0;padding-left:20px}.todo li{margin:6px 0}
.todo li::marker{color:var(--pink-ink);font-weight:800}
.notice{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:18px}
@media (max-width:640px){.reply{grid-template-columns:1fr}.rbody dl{grid-template-columns:1fr}.rbody dt{margin-top:4px}.count{margin-left:0;width:100%}.gate-card{padding:28px 22px}.pw-row{flex-direction:column}.pw-row .btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const SKEY='ippeo2_review_v2_key', KEY='ippeo2_review_v2_replies';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decryptWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.iv)},key,b64d(ENC.ct));return JSON.parse(new TextDecoder().decode(pt))}
function mount(d){const g=document.getElementById('gate');if(g)g.remove();const app=document.getElementById('app');app.innerHTML=d.html;app.hidden=false;initApp(d.req,d.status);
 if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
async function tryStored(){try{const raw=sessionStorage.getItem(SKEY);if(!raw)return;const k=await crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},false,['decrypt']);mount(await decryptWith(k))}catch(e){try{sessionStorage.removeItem(SKEY)}catch(_){}}}
(function gate(){const f=document.getElementById('gate-form'),pw=document.getElementById('pw'),btn=document.getElementById('pw-btn'),err=document.getElementById('gate-err');
 if(!(window.crypto&&crypto.subtle)){err.textContent='이 브라우저에서는 열 수 없습니다. 최신 Chrome·Edge·Safari로 여세요.';btn.disabled=true;return}
 f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='확인 중';
  try{const k=await deriveKey(pw.value);const d=await decryptWith(k);try{sessionStorage.setItem(SKEY,b64e(await crypto.subtle.exportKey('raw',k)))}catch(_){}mount(d)}
  catch(x){err.textContent='비밀번호가 맞지 않습니다. 다시 입력하세요.';pw.select();btn.disabled=false;btn.textContent='열기'}});
 tryStored();})();

function initApp(REQ,STATUS){
 let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
 const $=s=>document.querySelector(s);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
 const val=id=>state[id]||{status:'미확인',vendor:'',medihim:'',link:''};
 let openAll=false;
 $('#lock').onclick=()=>{try{sessionStorage.removeItem(SKEY)}catch(_){}location.reload()};
 [...new Set(REQ.map(r=>r.cat))].forEach(c=>{const o=document.createElement('option');o.textContent=c;$('#fc').appendChild(o)});
 const stCls=s=>s==='완료'?'ok':(s==='미확인'?'neutral':'warn');
 function render(){
  const q=$('#q').value.trim().toLowerCase(),p=$('#fp').value,c=$('#fc').value,s=$('#fs').value;
  const list=REQ.filter(r=>(!q||[r.id,r.rel,r.title,r.ask,r.basis,r.evidence].join(' ').toLowerCase().includes(q))&&(!p||r.pri===p)&&(!c||r.cat===c)&&(!s||val(r.id).status===s));
  $('#count').textContent=list.length+' / '+REQ.length+'건';
  let cur='',out='';
  for(const r of list){
   if(r.cat!==cur){cur=r.cat;out+=`<div class="cat">${esc(cur)}</div>`}
   const v=val(r.id);
   out+=`<details class="req" id="${r.id}" ${openAll?'open':''}><summary><span class="rid">${r.id}</span><span class="tag ${r.pri.toLowerCase()}">${r.pri}</span><span class="rt">${esc(r.title)}</span><span class="rel">${esc(r.rel)} · 담당 ${esc(r.owner)}</span><span class="tag ${stCls(v.status)}">${esc(v.status)}</span></summary>
   <div class="rbody"><dl><dt>확인 요청</dt><dd>${esc(r.ask)}</dd><dt>근거</dt><dd>${esc(r.basis)}</dd><dt>필요 증빙</dt><dd>${esc(r.evidence)}</dd></dl>
   <div class="reply"><div><label for="st-${r.id}">상태</label><select id="st-${r.id}" data-id="${r.id}" data-k="status">${STATUS.map(x=>`<option ${x===v.status?'selected':''}>${x}</option>`).join('')}</select>
   <label for="lk-${r.id}" class="mt">증빙 링크·파일명</label><input id="lk-${r.id}" data-id="${r.id}" data-k="link" value="${esc(v.link)}" placeholder="파일명 / 저장 경로 / 링크"></div>
   <div><label for="vd-${r.id}">메타소프트 답변</label><textarea id="vd-${r.id}" data-id="${r.id}" data-k="vendor" placeholder="담당자·답변·제출일">${esc(v.vendor)}</textarea></div>
   <div class="full"><label for="md-${r.id}">메디힘 검토 의견</label><textarea id="md-${r.id}" data-id="${r.id}" data-k="medihim">${esc(v.medihim)}</textarea></div></div></div></details>`;
  }
  $('#list').innerHTML=out||'<p class="purpose">조건에 맞는 항목이 없다.</p>';
 }
 ['#q','#fp','#fc','#fs'].forEach(s=>$(s).addEventListener(s==='#q'?'input':'change',render));
 $('#list').addEventListener('input',e=>{const t=e.target;if(!t.dataset.id)return;const o=val(t.dataset.id);o[t.dataset.k]=t.value;state[t.dataset.id]=o;persist();if(t.dataset.k==='status')render()});
 $('#expand').onclick=()=>{openAll=!openAll;document.querySelectorAll('details.req').forEach(d=>d.open=openAll);$('#expand').textContent=openAll?'모두 접기':'모두 펼치기'};
 function copyText(txt,btn,label){const done=()=>{btn.textContent='복사됨';setTimeout(()=>btn.textContent=label,1500)};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fb)}else fb()}
 const cell=s=>{s=String(s??'').replace(/\r?\n/g,' / ');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 $('#csv').onclick=e=>{const h=['ID','구분','우선순위','관련 과업','요청','확인 요청 내용','근거','필요 증빙','담당','상태','증빙','메타소프트 답변','메디힘 의견'];
  const rows=REQ.map(r=>{const v=val(r.id);return [r.id,r.cat,r.pri,r.rel,r.title,r.ask,r.basis,r.evidence,r.owner,v.status,v.link,v.vendor,v.medihim].map(cell).join(',')});
  copyText('﻿'+[h.map(cell).join(','),...rows].join('\n'),e.target,'CSV 복사')};
 $('#save').onclick=e=>{const txt=JSON.stringify({version:2,savedAt:new Date().toISOString(),replies:state},null,1);
  try{const b=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ippeo2_검수답변.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(x){}
  copyText(txt,e.target,'답변 JSON 저장')};
 $('#load').onclick=()=>$('#file').click();
 $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());const r=o.replies||o;for(const k in r){if(REQ.some(x=>x.id===k))state[k]=Object.assign(val(k),r[k])}persist();render()}catch(x){$('#count').textContent='JSON 형식 오류'}e.target.value=''};
 render();
}
</script>
</body>
</html>
